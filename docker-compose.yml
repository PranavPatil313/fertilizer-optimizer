version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - ENV=production
      - JWT_SECRET=super-secret-production-key
    volumes:
      # Persist SQLite database across container restarts
      - ./fertilizer.db:/app/fertilizer.db

  frontend:
    build:
      context: ./fert-frontend
      dockerfile: Dockerfile
      args:
        # By leaving this blank, React will automatically use the same domain it is hosted on.
        VITE_API_URL: ""
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config: