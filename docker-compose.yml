services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - CORS_ORIGINS=http://localhost:3000
      # Inject your API Keys here:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecret_production_key_123}
    volumes:
      - ./fertilizer.db:/app/fertilizer.db
      - ./src/data:/app/src/data
      - ./src/artifact:/app/src/artifact
    restart: unless-stopped

  frontend:
    build:
      context: ./fert-frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped